name: Build and push images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.prefix }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          PREFIX="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::12}"
          fi
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Images: ${PREFIX}/api:${TAG} and ${PREFIX}/web:${TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve API URL baked into the web image
        id: weburl
        run: |
          URL="${{ vars.PRODUCTION_API_URL }}"
          if [ -z "$URL" ]; then
            URL="https://api.example.com"
            echo "::warning::PRODUCTION_API_URL is not set. Web image will use ${URL}. Rebuild after DNS exists."
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.web
          push: true
          build-args: |
            API_BASE_URL=${{ steps.weburl.outputs.url }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GHCR_IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          APP_DIR: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,GHCR_IMAGE_PREFIX,APP_DIR
          script_stop: true
          script: |
            set -euo pipefail
            cd "${APP_DIR:-/opt/fieldops}"
            git fetch origin
            git checkout --force "${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            tmp="$(mktemp)"
            grep -vE '^(IMAGE_TAG|GHCR_IMAGE_PREFIX)=' .env > "$tmp" || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> "$tmp"
            echo "GHCR_IMAGE_PREFIX=${GHCR_IMAGE_PREFIX}" >> "$tmp"
            mv "$tmp" .env
            bash scripts/server-deploy.sh

      - name: Production smoke test
        if: vars.DOMAIN_API != ''
        run: |
          set -euo pipefail
          API="${{ vars.DOMAIN_API }}"
          APP="${{ vars.DOMAIN_APP }}"
          echo "Checking http(s)://${API}/health"
          curl -fsS --retry 8 --retry-delay 3 "https://${API}/health" \
            || curl -fsS --retry 8 --retry-delay 3 "http://${API}/health"
          if [ -n "$APP" ]; then
            curl -fsS --retry 5 --retry-delay 2 "https://${APP}/healthz" \
              || curl -fsS --retry 5 --retry-delay 2 "http://${APP}/healthz" \
              || curl -fsS "http://${APP}/"
          fi
          echo "Smoke test passed"

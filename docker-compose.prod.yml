name: fieldops-ai-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fieldops

  api:
    image: ${GHCR_IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fieldops

  web:
    image: ${GHCR_IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_BASE_URL: https://${DOMAIN_API}
    restart: unless-stopped
    networks:
      - fieldops

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - fieldops

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN_GRAFANA}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - fieldops

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/rendered/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./infra/nginx/certs:/etc/letsencrypt:ro
      - ./infra/nginx/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - grafana
    networks:
      - fieldops

  certbot:
    image: certbot/certbot
    volumes:
      - ./infra/nginx/certs:/etc/letsencrypt
      - ./infra/nginx/www:/var/www/certbot
    profiles:
      - certs
    entrypoint: certbot
    networks:
      - fieldops

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  fieldops:
    driver: bridge
